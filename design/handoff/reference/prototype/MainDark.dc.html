<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nathan Potter — CV, dark theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.np{--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--fs-1:0.8125rem;--fs-2:0.9375rem;--fs-3:1.0625rem;--fs-4:1.3125rem;--fs-5:1.75rem;--fs-6:clamp(2.25rem,6vw,3.5rem);--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;--sp-8:72px;--r-1:4px;--r-2:8px;--r-pill:999px;--bg:#F2F5F5;--surface:#FFFFFF;--surface-2:#E6ECEC;--raised:#FFFFFF;--ink:#151A1B;--ink-2:#4A5557;--line:#D2DBDB;--brand:#0F6E73;--brand-ink:#FFFFFF;--band:#0F6E73;--band-ink:#FFFFFF;--band-line:rgba(255,255,255,.35);--accent:#7A0E1B;--accent-text:#7A0E1B;--chip:#E3EEEE;--cta-bg:#FFFFFF;--cta-ink:#0F6E73;--cta-sub:#4A5557;--cta-dot:#0F6E73;--cta-dot-ink:#FFFFFF;--shadow-1:0 1px 2px rgba(10,30,32,.08),0 1px 1px rgba(10,30,32,.04);--shadow-2:0 8px 24px rgba(10,30,32,.12);color-scheme:light}
.np[data-theme="dark"]{--bg:#0D1213;--surface:#151C1E;--surface-2:#1D2628;--raised:#212B2D;--ink:#E9EFEF;--ink-2:#A3B1B3;--line:#2F3B3D;--brand:#6CCBD0;--brand-ink:#071113;--band:#0B2F32;--band-ink:#EAF5F5;--band-line:rgba(234,245,245,.22);--accent:#B8344A;--accent-text:#E9EFEF;--chip:#1F3335;--cta-bg:#6CCBD0;--cta-ink:#071113;--cta-sub:#14373A;--cta-dot:#071113;--cta-dot-ink:#6CCBD0;--shadow-1:0 0 0 1px rgba(255,255,255,.02),0 1px 2px rgba(0,0,0,.5);--shadow-2:0 0 0 1px rgba(255,255,255,.04),0 12px 32px rgba(0,0,0,.55);color-scheme:dark}
.np a{color:var(--brand)}.np a:hover{color:var(--accent-text)}
.np :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:2px}
.np summary{list-style:none;cursor:pointer}.np summary::-webkit-details-marker{display:none}
.np .chev{transition:transform .18s ease}.np details[open]>summary .chev{transform:rotate(180deg)}
.np .navlink:hover{background:var(--surface-2);color:var(--ink)}
.np .cta{transition:transform .15s ease}.np .cta:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.np *{transition:none!important}.np .cta:hover{transform:none}}
</style>
</helmet>
<div style="width: 100%; min-height: 5400px">
<dc-import name="Main" theme="dark" contact-open="{{ true }}" hint-size="100%,5400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":5400}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
