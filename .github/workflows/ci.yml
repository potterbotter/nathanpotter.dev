# Runs the tests and the site build on every push and pull request.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: the tests and build need no install scripts (skips wrangler's runtime download).
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node build/build.mjs
